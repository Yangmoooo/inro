# Inro Configuration File
# Location: $INRO_HOME/config.toml (default: ~/.inro/config.toml)
# All settings are optional. Uncomment and modify the ones you want to override.

# =============================================================================
# Install settings
# =============================================================================

# The directory where executable symlinks will be created.
# Run `inro doctor` to check whether this directory is in your PATH.
# Environment variable override: INRO_BIN_DIR
# Default: "~/.local/bin"
#
# bin_dir = "~/bin"


# =============================================================================
# Source settings
# =============================================================================

# A list of remote registry TOML files.
# Inro will fetch and cache these sources when you run `inro source update`.
# The "default" upstream is built-in but can be overridden here if you want to use a fork.
#
# upstreams = [
#   { name = "default", priority = 0, url = "https://raw.githubusercontent.com/Yangmoooo/inro-registry/main/default.toml" },
#   { name = "work", priority = 10, enabled = false, url = "https://internal-gitlab.com/team/my-tools/main/work.toml" }
# ]


# =============================================================================
# Behavior and performance settings
# =============================================================================

# Number of packages to download in parallel during a multi-package install/update.
# Valid range: 1-32
# Environment variable override: INRO_PARALLEL_DOWNLOADS
# Default: clamp(CPU cores * 2, 4, 16)
#
# parallel_downloads = 8


# GitHub token is configured only via environment variables:
# INRO_GITHUB_TOKEN (preferred) or GITHUB_TOKEN.
