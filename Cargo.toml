[package]
name = "inro"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.2"
reqwest = { version = "0.13", default-features = false, features = [
    "http2",
    "rustls",
    "blocking",
    "charset",
    "gzip",
    "brotli",
    "zstd",
    "deflate",
    "query",
    "json",
    "socks",
    "system-proxy",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
colored = "3.0"
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.9"
dirs = "6"
tempfile = "3"
tar = "0.4"
flate2 = "1.1"
xz2 = "0.1"
zip = "7"
bzip2 = "0.6"
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
chrono-humanize = "0.2"
supports-hyperlinks = "3.2"
sevenz-rust2 = "0.20"
humansize = "2.1"
fs_extra = "1.3"

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
