# this package is just an example, DO NOT USE
[example]

# GitHub Releases is the primary package remote.
[example.remote.github]
repo = "example/example"

# platform-specific asset selectors
# String selectors are minimal glob patterns matched against the full asset name
# Array selectors are all-of tokens; every token must appear in the asset name
[example.remote.github.asset]
"linux-x86_64" = "example-*-x86_64-unknown-linux-musl.tar.gz"
"windows-x86_64" = ["example", "x86_64", "windows", "msvc", "zip"]

# binaries
[[example.bin]]
# name of the binary inside the asset, defaults to the name of the package
name = "example"
# name to link the binary, defaults to the bin.name
link = "example"

# Direct URLs are available for tools without suitable GitHub Releases.
# The version is the table key, which keeps each version bound to its URLs.
[direct-example]
[direct-example.remote.direct."1.0.0"]
"linux-x86_64" = "https://example.com/direct-example-linux-x86_64.tar.gz"
"macos-aarch64" = "https://example.com/direct-example-macos-aarch64.tar.gz"
"windows-x86_64" = "https://example.com/direct-example-windows-x86_64.zip"
[[direct-example.bin]]
name = "direct-example"


