# this package is just an example, DO NOT USE
[example]
# typically a release tag, defaults to latest
ver = "vX.Y.Z"

# remote types: github, direct (not implemented yet)
[example.remote.github]
repo = "example/example"

# platform-specific asset file names
[example.remote.github.asset]
"linux-x86_64" = "example-x86_64-unknown-linux-musl.tar.gz"
"windows-x86_64" = "example-x86_64-pc-windows-msvc.zip"

# binaries
[[example.bin]]
# name of the binary inside the asset, defaults to the name of the package
name = "example"
# name to link the binary, defaults to the bin.name
link = "example"


# Example with platform-specific binary names and links
# This is useful when different platforms have different binary names in the archive
[codex-example]
ver = "vX.Y.Z"

[codex-example.remote.github]
repo = "example/codex"

[codex-example.remote.github.asset]
"linux-x86_64" = "codex-x86_64-unknown-linux-musl.tar.gz"
"windows-x86_64" = "codex-x86_64-pc-windows-msvc.exe.zip"

# Main binary - different name on each platform
[[codex-example.bin]]
[codex-example.bin.name]
"linux-x86_64" = "codex-x86_64-unknown-linux-musl"
"windows-x86_64" = "codex-x86_64-pc-windows-msvc.exe"

[codex-example.bin.link]
"linux-x86_64" = "codex"
"windows-x86_64" = "codex"

# Windows-only helper binaries (only present on Windows)
[[codex-example.bin]]
[codex-example.bin.name]
"windows-x86_64" = "codex-windows-sandbox-setup.exe"

[[codex-example.bin]]
[codex-example.bin.name]
"windows-x86_64" = "codex-command-runner.exe"


