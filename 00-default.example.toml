# this package is just an example, DO NOT USE
[example]
# typically a release tag, defaults to latest
ver = "vX.Y.Z"

# remote types: github, direct (not implemented yet)
[example.remote.github]
repo = "example/example"

# platform-specific asset file names
[example.remote.github.asset]
"linux-x86_64"   = "example-x86_64-unknown-linux-musl.tar.gz"
"windows-x86_64" = "example-x86_64-pc-windows-msvc.zip"

# binaries
[[example.bin]]
# name of the binary inside the asset, defaults to the name of the package
name = "example"
# name to link the binary, defaults to the name of the package
link = "example"



[btop]
[btop.remote.github]
repo = "aristocratos/btop"

[eza]
[eza.remote.github]
repo = "eza-community/eza"

[fastfetch]
[fastfetch.remote.github]
repo = "fastfetch-cli/fastfetch"

[fx]
[fx.remote.github]
repo = "antonmedv/fx"

[fzf]
[fzf.remote.github]
repo = "junegunn/fzf"

[jq]
[jq.remote.github]
repo = "jqlang/jq"
# jq provides a single binary, although it's jq-{os}-{arch}, bin is unnecessary

[ripgrep]
[ripgrep.remote.github]
repo = "BurntSushi/ripgrep"
[[ripgrep.bin]]
name = "rg"

[fd]
[fd.remote.github]
repo = "sharkdp/fd"

[tldr]
[tldr.remote.github]
repo = "tealdeer-rs/tealdeer"
[tldr.remote.github.asset]
"linux-x86_64" = "linux-x86_64-musl"

[tokei]
[tokei.remote.github]
repo = "XAMPPRocky/tokei"

[uv]
[uv.remote.github]
repo = "astral-sh/uv"
[[uv.bin]]
name = "uv"
[[uv.bin]]
name = "uvx"
